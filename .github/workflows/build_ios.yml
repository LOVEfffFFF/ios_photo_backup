name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Generate iOS project files
        run: |
          flutter create --platforms=ios --org com.photobackup --project-name photo_backup .

      - name: Install dependencies
        run: flutter pub get

      - name: Select Xcode
        run: |
          # macOS 15 runner 自带多个 Xcode 版本
          ls /Applications/Xcode*.app
          # 使用 Xcode 16.2 (兼容 iOS 17 目标 + Flutter 3.29)
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          # 查看已安装的 iOS SDK 版本
          xcrun simctl list runtimes 2>/dev/null | grep -i ios || true
          ls /Applications/Xcode_16.2.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ || true

      - name: Build iOS App (Debug - for personal signing)
        if: github.event.inputs.build_type != 'release'
        run: |
          cd ios
          xcodebuild clean build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'generic/platform=iOS,name=Any iOS Device' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Build iOS App (Release)
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd ios
          xcodebuild clean build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS,name=Any iOS Device' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=17.0

      - name: Create Payload and IPA
        run: |
          # xcodebuild 构建产物在 ios/build/ 下
          # 查找生成的 .app 文件
          APP_PATH=$(find ios/build -name "Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            # 备用：查找 xcodebuild 默认输出位置
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -path "*/Build/Products/*" -type d | head -1)
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PhotoBackup.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh PhotoBackup.ipa | cut -f1)"
          echo ""
          echo "============================================"
          echo "  Build Info"
          echo "  Target Device: iPhone 14 Pro Max"
          echo "  Target iOS:    17.7.2"
          echo "  Min iOS:       17.0"
          echo "  Architecture:  arm64"
          echo "============================================"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBackup-${{ github.sha }}
          path: PhotoBackup.ipa
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/
            ios/build/
          retention-days: 7

  # ============================================================
  # 可选：使用 Codemagic CLI 进行签名构建
  # 需要在 GitHub Secrets 中配置：
  #   - APPLE_DEVELOPER_CERTIFICATE (Base64 编码的 .p12 证书)
  #   - APPLE_DEVELOPER_CERTIFICATE_PASSWORD
  #   - APPLE_PROVISION_PROFILE (Base64 编码的 .mobileprovision)
  #   - KEYCHAIN_PASSWORD
  # ============================================================
  build-signed:
    name: Build Signed iOS IPA
    runs-on: macos-latest
    if: false  # 默认禁用，需要签名时改为 true
    needs: []   # 不依赖其他 job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup code signing
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.APPLE_PROVISION_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 创建临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # 导入证书
          echo "$CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign

          # 导入描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

          # 允许 codesign 访问钥匙串
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build signed IPA
        run: |
          flutter build ipa --release --export-method=ad-hoc

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBackup-Signed-${{ github.sha }}
          path: build/ios/ipa/*.ipa
          retention-days: 30

  # ============================================================
  # 代码质量检查（可选）
  # ============================================================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
