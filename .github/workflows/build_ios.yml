name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定验证过的版本：'stable' 是滚动分支，Flutter 升级会导致
          # 「上次能编、这次编不过」（3.47 起插件改为 Swift Package，曾因此构建失败）
          flutter-version: '3.47.6'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          # 记录构建环境：排查「上次能编、这次编不过」时第一件事就是对比这段
          # 详见工作区文档《CI构建踩坑与排查手册.md》
          echo "===== BUILD ENVIRONMENT ====="
          echo "runner.image : ${{ runner.os }} / ${{ runner.arch }}"
          echo "runner.name  : ${{ runner.name }}"
          xcodebuild -version
          echo "sdk          : $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "macos        : $(sw_vers -productVersion)"
          echo "FLUTTER_ROOT : $FLUTTER_ROOT"
          echo "=============================="

      - name: Generate iOS project files
        run: |
          flutter create --platforms=ios --org com.photobackup --project-name photo_backup .

      - name: Install dependencies
        run: flutter pub get

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          # 确认 iOS 平台已安装
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure Xcode project for CI build
        run: |
          # flutter create 会重置 deployment target（默认 iOS 12），需改回 17.0
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' "$PBXPROJ"
          # 修改 project.pbxproj 禁用代码签名，绕过 Team 检查
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"
          # 在所有 buildSettings 块中添加 CODE_SIGNING_ALLOWED = NO
          sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER/a\
            \t\t\tCODE_SIGNING_ALLOWED = NO;\
            \t\t\tCODE_SIGNING_REQUIRED = NO;\
            \t\t\tDEVELOPMENT_TEAM = "";' "$PBXPROJ"
          # Xcode 26 起：即使带 --no-codesign，flutter 仍会校验 Development Team
          # 而报「Building a deployable iOS app requires a selected Development Team」。
          # 只改 pbxproj 不够，必须在 xcconfig 里也显式置空。
          for CFG in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig ios/Flutter/Profile.xcconfig; do
            if [ -f "$CFG" ]; then
              printf '\nDEVELOPMENT_TEAM =\nCODE_SIGN_IDENTITY =\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGNING_ALLOWED = NO\n' >> "$CFG"
            fi
          done
          echo "=== Patched project.pbxproj ==="
          grep "IPHONEOS_DEPLOYMENT_TARGET" "$PBXPROJ" || true
          grep -c "CODE_SIGNING_ALLOWED = NO" "$PBXPROJ" || true
          echo "=== Release.xcconfig 尾部 ==="
          tail -5 ios/Flutter/Release.xcconfig || true

      - name: Build iOS App (Debug - for personal signing)
        if: github.event.inputs.build_type != 'release'
        run: |
          tr -d '\r' < .github/scripts/build_ios.sh > /tmp/build_ios.sh
          bash /tmp/build_ios.sh Debug

      - name: Build iOS App (Release)
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          tr -d '\r' < .github/scripts/build_ios.sh > /tmp/build_ios.sh
          bash /tmp/build_ios.sh Release

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PhotoBackup.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh PhotoBackup.ipa | cut -f1)"
          echo ""
          echo "============================================"
          echo "  Build Info"
          echo "  Target Device: iPhone 14 Pro Max"
          echo "  Target iOS:    17.7.2"
          echo "  Min iOS:       17.0"
          echo "  Architecture:  arm64"
          echo "============================================"

      - name: Upload IPA artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBackup-${{ github.sha }}
          path: PhotoBackup.ipa
          retention-days: 1

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/
            ios/build/
          retention-days: 1

  # ============================================================
  # 代码质量检查（可选）
  # ============================================================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定验证过的版本：'stable' 是滚动分支，Flutter 升级会导致
          # 「上次能编、这次编不过」（3.47 起插件改为 Swift Package，曾因此构建失败）
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
