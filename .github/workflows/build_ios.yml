name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Generate iOS project files
        run: |
          flutter create --platforms=ios --org com.photobackup --project-name photo_backup .

      - name: Install dependencies
        run: flutter pub get

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          # 确认 iOS 平台已安装
          xcrun --sdk iphoneos --show-sdk-version

      - name: Disable code signing in Xcode project
        run: |
          # 修改 project.pbxproj 禁用代码签名，绕过 Team 检查
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"
          # 在所有 buildSettings 块中添加 CODE_SIGNING_ALLOWED = NO
          sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER/a\
            \t\t\tCODE_SIGNING_ALLOWED = NO;\
            \t\t\tCODE_SIGNING_REQUIRED = NO;\
            \t\t\tDEVELOPMENT_TEAM = "";' "$PBXPROJ"
          echo "=== Patched project.pbxproj ==="
          grep -c "CODE_SIGNING_ALLOWED = NO" "$PBXPROJ" || true

      - name: Build iOS App (Debug - for personal signing)
        if: github.event.inputs.build_type != 'release'
        run: |
          flutter build ios --debug --no-codesign

      - name: Build iOS App (Release)
        if: github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter build ios --release --no-codesign

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PhotoBackup.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh PhotoBackup.ipa | cut -f1)"
          echo ""
          echo "============================================"
          echo "  Build Info"
          echo "  Target Device: iPhone 14 Pro Max"
          echo "  Target iOS:    17.7.2"
          echo "  Min iOS:       17.0"
          echo "  Architecture:  arm64"
          echo "============================================"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBackup-${{ github.sha }}
          path: PhotoBackup.ipa
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/
            ios/build/
          retention-days: 7

  # ============================================================
  # 代码质量检查（可选）
  # ============================================================
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
