name: photo_backup
description: iOS 相册备份与恢复工具 - 支持增量备份、Live Photo、WiFi 传输
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  path: ^1.8.3
  wakelock_plus: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
